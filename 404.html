                    var theme = 'light';
                    if (qTheme === 'light' || qTheme === 'dark') {
                        theme = qTheme;
                    } else {
                        var t = localStorage.getItem('reflog-theme');
                        if (t === 'dark' || t === 'light') {
                            theme = t;
                        } else {
                            var match = document.cookie.match(/reflog-theme=(dark|light)/);
                            if (match) {
                                theme = match[1];
                            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                                theme = 'dark';
                            }
                        }
                    }
                    document.documentElement.setAttribute('data-theme', theme);
                } catch (e) {}
            })();
        </script>

        <style>
            :root {
                --ground: #f5f7fa;
                --surface: #ffffff;
                --ink: #0e1030;
                --muted: #5a6578;
                --border: #0e1030;
                --shadow: #0e1030;
                --accent: #2a2fd6;
                --codebg: #0e1030;
                --codeink: #f5f7fa;
                --font-display: 'Unbounded', system-ui, sans-serif;
                --font-mono: 'DM Mono', monospace;
            }
            [data-theme='dark'] {
                --ground: #0b1016;
                --surface: #111922;
                --ink: #e6edf3;
                --muted: #8b949e;
                --border: #26323f;
                --shadow: #000000;
                --accent: #a3e635;
                --codebg: #05080c;
                --codeink: #a3e635;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background-color: var(--ground);
                color: var(--ink);
                font-family: var(--font-mono);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .error-card {
                background: var(--surface);
                border: 2px solid var(--border);
                box-shadow: 6px 6px 0 var(--shadow);
                max-width: 620px;
                width: 100%;
                padding: 36px 32px;
            }
            .error-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 20px;
            }
            .error-tag {
                font-size: 13px;
                color: var(--accent);
                font-weight: 500;
                letter-spacing: 0.05em;
            }
            .error-title {
                font-family: var(--font-display);
                font-size: 32px;
                line-height: 1.2;
                margin-bottom: 16px;
            }
            .terminal-box {
                background: var(--codebg);
                color: var(--codeink);
                border: 1px solid var(--border);
                padding: 16px;
                font-size: 14px;
                line-height: 1.6;
                margin: 20px 0;
            }
            .terminal-box .cmd {
                color: #ffffff;
            }
            .terminal-box .err {
                color: #ef4444;
            }
            .error-desc {
                font-size: 14px;
                color: var(--muted);
                line-height: 1.6;
                margin-bottom: 24px;
            }
            .btn-home {
                display: inline-block;
                background: var(--accent);
                color: #ffffff;
                text-decoration: none;
                font-weight: 500;
                font-size: 14px;
                padding: 12px 24px;
                border: 2px solid var(--border);
                box-shadow: 3px 3px 0 var(--shadow);
                transition: transform 0.1s ease, box-shadow 0.1s ease;
            }
            [data-theme='dark'] .btn-home {
                color: #0b1016;
            }
            .btn-home:hover {
                transform: translate(-1px, -1px);
                box-shadow: 4px 4px 0 var(--shadow);
            }
        </style>
    </head>
    <body>
        <main class="error-card">
            <div class="error-header">
                <span class="error-tag">// 404 NOT FOUND</span>
            </div>
            <h1 class="error-title">Reference Not Found</h1>
            <p class="error-desc">
                The ref or page you requested does not exist in this tree.
            </p>
            <div class="terminal-box">
                <span class="cmd">$ git checkout HEAD@{404}</span><br />
                <span class="err">fatal: reference not found: HEAD@{404}</span><br />
                <span>error: pathspec did not match any file(s) known to git</span>
            </div>
            <a href="/" class="btn-home">Return to Homepage</a>
        </main>
    </body>
</html>
